// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Cordova's Android test graph still requests Kotlin 1.6 jdk7/jdk8 split
    // artifacts, while current AndroidX tests use the merged 1.8 stdlib. Keep
    // every module on one Kotlin runtime so connected tests do not package
    // duplicate classes. This does not add Kotlin to the production graph.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.8.22'
                details.because 'Use one Kotlin stdlib across app and generated plugin test modules'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
